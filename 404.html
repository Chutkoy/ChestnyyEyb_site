    <title>Ошибка 404 — Честный Эйб</title>
    <meta name="description" content="Страница не найдена. Вернитесь на базу инди-студии Честный Эйб." />
    <meta name="robots" content="noindex, nofollow" />
    
    <link type="image/x-icon" rel="shortcut icon" href="./images/favicon/favicon.ico" />
    <link type="image/png" sizes="32x32" rel="icon" href="./images/favicon/favicon-32.png" />

    <style>
      .error-404 {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 50px 20px;
        color: #d5d5d5;
        font-family: "Montserrat_0", sans-serif;
      }
      
      .error-404__logo svg {
        width: 280px;
        height: auto;
        fill: #d5d5d5;
        margin-bottom: 40px;
        transition: fill 0.3s ease;
      }
      .error-404__logo:hover svg {
        fill: #24a0b0;
      }

      .error-404__code {
        font-size: 8rem;
        font-weight: bold;
        color: #ffffff;
        line-height: 1;
        margin-bottom: 20px;
        letter-spacing: -2px;
      }
      
      .error-404__title {
        font-size: 2rem;
        margin-bottom: 15px;
        color: #d5d5d5;
        font-weight: 500;
      }
      
      .error-404__text {
        font-size: 1.1rem;
        max-width: 550px;
        line-height: 1.6;
        margin-bottom: 50px;
        color: #a0a0a0;
      }

      .error-404__link {
        display: inline-flex;
        align-items: center;
        gap: 15px;
        padding: 18px 32px;
        background-color: transparent;
        color: #d5d5d5;
        text-decoration: none;
        font-weight: 500;
        font-size: 1rem;
        border: 2px solid #4a4c4e;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      
      .error-404__link svg {
        width: 20px;
        height: 20px;
        fill: #d5d5d5;
        transition: all 0.3s ease;
      }
      
      .error-404__link:hover {
        border-color: #24a0b0;
        color: #24a0b0;
      }
      
      .error-404__link:hover svg {
        fill: #24a0b0;
        transform: translateX(5px);
      }
      
      /* Адаптив для мобильных */
      @media (max-width: 600px) {
        .error-404__code {
          font-size: 5rem;
        }
        .error-404__title {
          font-size: 1.5rem;
        }
        .error-404__logo svg {
          width: 200px;
        }
      }
    </style>
