<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ошибка 404 — Честный Эйб</title>
    <meta
      name="description"
      content="Страница не найдена. Вернитесь на базу инди-студии Честный Эйб — разработчика игр и приложений для Android."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://chestnyyeyb.ru/404.html" />
    <link
      type="image/x-icon"
      rel="shortcut icon"
      href="./images/favicon/favicon.ico"
    />
    <link
      type="image/png"
      sizes="32x32"
      rel="icon"
      href="./images/favicon/favicon-32.png"
    />
    <link
      type="image/png"
      sizes="196x196"
      rel="icon"
      href="./images/favicon/favicon-196.png"
    />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/cookie.css" />
    <link rel="stylesheet" href="./css/a11y.css" />
    <script src="./js/cookie.js" defer></script>
    <script src="./js/a11y.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="error-404">
        <div class="error-404__code">404</div>
        <h1 class="error-404__title">Упс! Трюк не удался.</h1>
        <p class="error-404__text">
          Кажется, вы свернули не туда, и корпорация
          <b style="color: #962828">Eidovyrex</b> скрыла эту страницу.<br />
          Не расстраивайтесь, давайте вернёмся на базу и продолжим борьбу!
        </p>
        <a href="./" class="error-404__link">
          <span>Вернуться на базу</span>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"
            />
          </svg>
        </a>
      </main>
      <div id="cookieConsent">
        <div class="cookie-title">
          <img src="./images/Cookie/Cookie.svg" alt="мы используем cookie" />
        </div>
        <div class="cookie-buttons">
          <button onclick="acceptCookies()">
            <img src="./images/Cookie/Accept.svg" alt="принять" />
          </button>
          <button onclick="declineCookies()">
            <img src="./images/Cookie/Reject.svg" alt="отклонить" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
